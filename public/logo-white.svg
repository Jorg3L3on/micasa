  </desc>
  <defs>
    <linearGradient id="micasaBrandGradientWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d8bff" />
      <stop offset="38%" stop-color="#3a37fc" />
      <stop offset="100%" stop-color="#ee477a" />
    </linearGradient>
    <linearGradient id="micasaBrandGlossWhite" x1="0%" y1="0%" x2="55%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0" />
