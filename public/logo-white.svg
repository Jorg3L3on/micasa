    <circle cx="20" cy="80" r="12" fill="url(#micasaBrandGradientWhite)" />
    <circle cx="54" cy="24" r="12" fill="url(#micasaBrandGradientWhite)" />
    <circle cx="88" cy="80" r="12" fill="url(#micasaBrandGradientWhite)" />
    <circle cx="122" cy="24" r="12" fill="url(#micasaBrandGradientWhite)" />
    <circle cx="156" cy="80" r="12" fill="url(#micasaBrandGradientWhite)" />
    <path
