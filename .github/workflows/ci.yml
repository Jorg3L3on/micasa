name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the DATE-column round-trip. Generate, validators,
      # isolation tests, and the Next build keep the placeholder URL below.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # prisma.config.ts loads this via env(); not required to be reachable for generate or build.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci

      # Client is generated to src/generated/prisma (gitignored); required for tests and build.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Metric strip rules
        run: npm run validate:metric-strips

      - name: Prisma import rules
        run: npm run validate:prisma-imports

      - name: Calendar date anti-patterns
        run: npm run validate:calendar-dates

      - name: Unit tests with finance coverage gate
        env:
          # Local service only. 127.0.0.1 avoids localhost resolving to IPv6.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          npx prisma migrate deploy
          npm run test:coverage

      - name: Cross-tenant isolation tests
        run: npm run test:isolation

      - name: Next.js build
        env:
          # Source map upload via withSentryConfig (org/project in next.config.ts)
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CI: true
        run: npm run build
